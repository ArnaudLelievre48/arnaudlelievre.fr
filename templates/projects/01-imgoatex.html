<div
	class="project-theme"
	data-theme-background="#0b1216"
	data-theme-surface="#dff2e5"
	data-theme-text="#f2f7f3"
	data-theme-accent="#86b895"
	data-theme-button-text="#284133"
	data-theme-glow="#6fab82"
	data-theme-pattern="rgba(134, 184, 149, 0.16)"
	data-theme-effect="grid"
	hidden
></div>
<div class="left-hero">
	<div class="left-top-hero-row">
		<img class="logo-project" src="{{ url_for('static', filename='ImGoaTeX-white.png') }}" alt="ImGoaTeX">
	</div>
	<div class="spearator-top-bottom"></div>
	<div class="left-bottom-hero">
		<p class="right-hero-text">ImGoaTeX is a programming language that I created, it</p>
		<p class="right-hero-text">aims to replace LaTeX's Beamer library by allowing for videos,</p>
		<p class="right-hero-text"> GIFs, slide animations and more, while simplifying some syntaxes</p>
		<button class="project-goto" onclick="window.open('https://imgoatex.arnaudlelievre.fr/', '_blank')">Try ImGoaTeX out !</button>
	</div>
</div>
<div class="right-hero">
	<div class="right-hero-content">
		<p class="right-hero-text-title">ImGoaTeX - online editor</p>
		<video class="demo-project" autoplay muted loop playsinline preload="metadata" aria-label="ImGoaTeX editor demo" onclick="window.open('https://imgoatex.arnaudlelievre.fr/', '_blank')">
			<source src="{{ url_for('static', filename='imgoatex-demo.mp4') }}" type="video/mp4">
		</video>
	</div>
</div>
